name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Shared KMP Framework
        run: ./gradlew :shared:assembleRelease

      - name: Build iOS App (Simulator/Ad-hoc)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create IPA (Unsigned)
        run: |
          mkdir -p build/artifacts
          cd iosApp
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/QuickCart.app Payload/
          zip -r ../build/artifacts/QuickCart-Unsigned.ipa Payload/
          rm -rf Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/artifacts/*.ipa
